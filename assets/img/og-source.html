<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    background: #fcfcfd;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #16161a;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 76px 84px; box-sizing: border-box;
    position: relative; overflow: hidden;
  }
  .top { display: flex; align-items: center; gap: 18px; }
  .top svg { width: 52px; height: 52px; display: block; }
  .top span { font-size: 32px; font-weight: 640; letter-spacing: -0.022em; }
  h1 {
    margin: 0; font-size: 78px; line-height: 1.08;
    font-weight: 640; letter-spacing: -0.035em; max-width: 15ch;
  }
  .rule { width: 92px; height: 4px; background: #2b5ce6; margin: 34px 0 30px; }
  p { margin: 0; font-size: 30px; color: #4a4a55; letter-spacing: -0.012em; }
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 24px; color: #6e6e7a; letter-spacing: -0.005em;
  }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 21px; letter-spacing: 0.09em; text-transform: uppercase; color: #6e6e7a;
  }
</style>
</head>
<body>
  <div class="top">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="7" fill="#2b5ce6"/>
      <path d="M9 22.5V9.5l7 6.5 7-6.5v13" fill="none" stroke="#fff" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Monkeyfuse</span>
  </div>

  <div>
    <h1>We build and launch our own iOS apps.</h1>
    <div class="rule"></div>
    <p>An independent software house in Kent, UK.</p>
  </div>

  <div class="foot">
    <span class="mono">monkeyfuse.com</span>
    <span>MasterMeals &mdash; in development</span>
  </div>
</body>
</html>
