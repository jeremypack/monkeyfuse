<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monkeyfuse - Creating innovative mobile applications">
    <title>Monkeyfuse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: 700;
        }
        
        .tagline {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 40px;
            font-weight: 300;
        }
        
        .description {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        
        .contact {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #eee;
        }
        
        .contact a {
            color: #667eea;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 500;
        }
        
        .contact a:hover {
            text-decoration: underline;
        }
        
        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #999;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            .tagline {
                font-size: 1em;
            }
            
            .description {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Monkeyfuse</h1>
        <p class="tagline">Creating innovative mobile applications</p>
        <p class="description">
            We're developing apps for iOS and other platforms. Stay tuned for exciting releases coming soon.
        </p>
        <div class="contact">
            <p>Contact us:</p>
            <p><a href="mailto:contact@monkeyfuse.com">contact@monkeyfuse.com</a></p>
        </div>
        <div class="footer">
            <p><a href="privacy.html">Privacy Policy</a></p>
        </div>
    </div>
</body>
</html>
